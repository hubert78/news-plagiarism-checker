name: Scrape News & Update Dataset

on:
  schedule:
    # Run once daily at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      days:
        description: 'Number of days back to scrape'
        required: true
        default: '3'

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Scraper to JSON
        run: |
          python scripts/scrape_to_json.py --days ${{ github.event.inputs.days || 3 }}

      - name: Commit and Push Updated Dataset
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/articles.json
          if git diff --staged --quiet; then
            echo "No new changes to commit."
          else
            git commit -m "chore(data): auto-update news articles dataset [skip ci]"
            git push
          fi
